plugins {
    id("idea")
    id("com.android.application") version "8.10.1" apply false
    id("com.android.library") version "8.10.1" apply false
    id("org.jetbrains.kotlin.android") version "2.1.21" apply false
    id("dev.rikka.tools.autoresconfig") version "1.2.2" apply false
    id("dev.rikka.tools.materialthemebuilder") version "1.5.1" apply false
    id("dev.rikka.tools.refine") version "4.4.0" apply false
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 35
            defaultConfig {
                minSdk = 24
                targetSdk = 35
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            buildFeatures {
                aidl = true
            }
        }
    }
    
    // 强行让 Kotlin 也使用 Java 17 的版本，解决昨天那个 JVM 兼容性报错
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = "custom"
def gitCommitCount = 14
def baseVersionName = "${api_version_major}.6.0"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}.r${gitCommitCount}.${gitCommitId}"
}
